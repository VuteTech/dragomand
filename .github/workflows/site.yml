#
# Builds the website and user documentation (doc/ + mkdocs-theme/) with
# mkdocs and deploys it to GitHub Pages. This replaces the Hugo workflow
# of the retired dragomand.l10n-bg.dev repository; doc/CNAME carries the
# custom domain. Enable Pages (source: GitHub Actions) in the repository
# settings before the first run.
name: Deploy site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mkdocs
        run: pip install mkdocs==1.6.1 mkdocs-static-i18n==1.3.1 pymdown-extensions==12.1
      - name: Build
        run: mkdocs build --strict
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
