name: CI

# Every push to master and every pull request. The release workflow also
# calls it on the tagged commit before anything reaches OBS; this workflow
# itself never publishes anything.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to test (empty: the triggering commit)"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The release scripts only run on a release, so check them on every
  # push: a script committed without its execute bit, or one that
  # shellcheck rejects, would otherwise fail only when publishing.
  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Scripts are executable
        run: |
          # Every tracked file with a #! line must be committed as 100755
          # (engine/vendor/ is third-party and left alone).
          bad=0
          while IFS= read -r file; do
            mode="$(git ls-files -s -- "$file" | cut -d' ' -f1)"
            if [ "$mode" != 100755 ]; then
              echo "::error file=$file::has a #! line but is committed as $mode, not 100755"
              bad=1
            fi
          done < <(git ls-files -- ':!engine/vendor' | while IFS= read -r f; do
            [ -f "$f" ] && head -c2 "$f" | grep -q '^#!' && echo "$f"
          done)
          exit "$bad"
      - name: shellcheck
        run: |
          git ls-files -z -- '*.sh' ':!engine/vendor' | xargs -0 shellcheck

  # Pure-Rust signal, fast: no C++ engine (--no-default-features).
  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  test:
    name: test (fake backend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-default-features

  # The declared minimum (rust-version in Cargo.toml) is the rustc that
  # Debian 13 ships. Stable alone notices neither newer syntax in our code
  # nor a dependency that needs a newer compiler than it declares.
  msrv:
    name: test (MSRV 1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --no-default-features

  # Full build with the C++ engine; slow on a cold ccache. Both package
  # architectures: ARM64 compiles different engine code (ruy, NEON) that
  # x86-64 never touches.
  engine:
    name: engine + full tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: engine-${{ matrix.arch }}
      - name: Install engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenblas-dev liblapack-dev libpcre2-dev zstd
      - name: Build engine
        run: |
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build engine/build -j 2
      - name: Clippy and tests with the real engine
        env:
          DRAGOMAN_ENGINE_LIB_DIR: ${{ github.workspace }}/engine/build
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
